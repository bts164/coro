name: Tests

# Builds the library and its tests and runs them, on each supported platform.
#
# One platform, the primary one, runs the tests under each sanitizer. Every other
# platform runs them once, with no sanitizer: that shows the library builds and
# passes there without paying for the sanitizer runs again.
#
# Each job is ci/run-tests.sh, run in the platform's CI image
# (docker/Dockerfile.<platform>). docker/run-tests.sh runs the same script in the
# same image on your own machine.
#
# To add a platform: add docker/Dockerfile.<platform> and docker/profiles/<platform>,
# then name it in both lists below. To change the primary platform, move the
# sanitizer rows to it, and change PRIMARY_PLATFORM in docker/common.sh, which is what
# pico_emulator.yml and a local run use.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    uses: ./.github/workflows/ci_image.yml
    with:
      # Every platform named in the test job's list, separated by spaces.
      # Not yet rocky10: docker/Dockerfile.rocky10 is unfinished.
      platforms: ubuntu2404
    permissions:
      contents: read
      packages: write

  test:
    name: ${{ matrix.platform }} (${{ matrix.sanitizer }})
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          # The primary platform: once under each sanitizer. asan includes UBSan.
          - { platform: ubuntu2404, sanitizer: asan }
          - { platform: ubuntu2404, sanitizer: tsan }
          # Every other platform: once, plain.
          # - { platform: rocky10, sanitizer: none }
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ fromJSON(needs.image.outputs.images)[matrix.platform] }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # --privileged only so that the ThreadSanitizer step below may change a kernel
      # setting. (--init is harmless; it is there because the value cannot be empty.)
      options: ${{ matrix.sanitizer == 'tsan' && '--privileged' || '--init' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # conan_version.py derives the package version from `git describe --tags`,
          # which finds nothing in the default shallow, tagless checkout.
          fetch-depth: 0

      # ThreadSanitizer aborts at start-up when the kernel randomises more address
      # bits than it expects. It is a setting of the runner's kernel, which the
      # container shares; docker/run-tests.sh makes the same check locally.
      - name: Lower address-space randomisation for ThreadSanitizer
        if: matrix.sanitizer == 'tsan'
        run: |
          bits="$(cat /proc/sys/vm/mmap_rnd_bits)"
          echo "vm.mmap_rnd_bits is $bits"
          if [ "$bits" -gt 28 ]; then
            echo 28 > /proc/sys/vm/mmap_rnd_bits
          fi

      - name: Build and run the tests
        run: ci/run-tests.sh ${{ matrix.sanitizer }}
