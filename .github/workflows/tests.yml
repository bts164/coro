name: Tests

# Builds the library and its tests and runs them, on each supported platform.
#
# One platform, the primary one, runs the tests under each sanitizer. Every other
# platform runs them once, with no sanitizer: that shows the library builds and
# passes there without paying for the sanitizer runs again.
#
# Each job is ci/run-tests.sh, run in the platform's CI image
# (docker/Dockerfile.<platform>). docker/run-tests.sh runs the same script in the
# same image on your own machine.
#
# To add a platform: add docker/Dockerfile.<platform> and docker/profiles/<platform>,
# then name it in both lists below. To change the primary platform, move the
# sanitizer rows to it, and change PRIMARY_PLATFORM in docker/common.sh, which is what
# pico_emulator.yml and a local run use.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this before it tags, with the version the tag will give.
  workflow_call:
    inputs:
      version:
        description: Build as this version, not the one derived from git. Empty to derive it.
        type: string
        default: ''

jobs:
  image:
    uses: ./.github/workflows/ci_image.yml
    with:
      # Every platform named in the test job's list, separated by spaces.
      platforms: ubuntu2404 rocky8
    permissions:
      contents: read
      packages: write

  test:
    name: ${{ matrix.platform }} (${{ matrix.sanitizer }})
    needs: image
    strategy:
      fail-fast: false
      matrix:
        include:
          # The primary platform: once under each sanitizer. asan includes UBSan.
          - { platform: ubuntu2404, sanitizer: asan }
          - { platform: ubuntu2404, sanitizer: tsan }
          # Every other platform: once, plain.
          - { platform: rocky8, sanitizer: none }
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    # Empty unless release.yml called this; conan_version.py then ignores it.
    env:
      CORO_VERSION_OVERRIDE: ${{ inputs.version }}
    container:
      image: ${{ fromJSON(needs.image.outputs.images)[matrix.platform] }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # --privileged only so that the ThreadSanitizer step below may change a kernel
      # setting. (--init is harmless; it is there because the value cannot be empty.)
      options: ${{ matrix.sanitizer == 'tsan' && '--privileged' || '--init' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # conan_version.py derives the package version from `git describe --tags`,
          # which finds nothing in the default shallow, tagless checkout.
          fetch-depth: 0

      # ThreadSanitizer aborts at start-up when the kernel randomises more address
      # bits than it expects. It is a setting of the runner's kernel, which the
      # container shares; docker/run-tests.sh makes the same check locally.
      - name: Lower address-space randomisation for ThreadSanitizer
        if: matrix.sanitizer == 'tsan'
        run: |
          bits="$(cat /proc/sys/vm/mmap_rnd_bits)"
          echo "vm.mmap_rnd_bits is $bits"
          if [ "$bits" -gt 28 ]; then
            echo 28 > /proc/sys/vm/mmap_rnd_bits
          fi

      # The third-party packages, built once and then kept in the Actions cache: a
      # sanitizer build compiles every one of them from source, and no remote has
      # libunicorn at all. coro itself is never in it.
      #
      # The key names the image, whose tag changes with the profiles and the
      # compiler. That matters: a profile's compiler flags are not part of a package
      # ID, so binaries built with other flags would be taken as they are. The
      # recipes are the rest of the key; when only they change, the previous cache is
      # restored (restore-keys) and only what is new gets built.
      - name: Look for cached Conan packages
        id: conan-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/conan-packages.tgz
          key: conan-${{ matrix.sanitizer }}-${{ fromJSON(needs.image.outputs.images)[matrix.platform] }}-${{ hashFiles('conanfile.py', 'conandata.yml', 'test/conanfile.py', 'test/libunicorn/**') }}
          restore-keys: |
            conan-${{ matrix.sanitizer }}-${{ fromJSON(needs.image.outputs.images)[matrix.platform] }}-

      - name: Restore the cached Conan packages
        run: |
          if [ -f "$RUNNER_TEMP/conan-packages.tgz" ]; then
            conan cache restore "$RUNNER_TEMP/conan-packages.tgz"
            rm "$RUNNER_TEMP/conan-packages.tgz"
          fi

      - name: Build and run the tests
        run: ci/run-tests.sh ${{ matrix.sanitizer }}

      # Also after a failed test run: the packages were built all the same. Not when
      # the key was found, since a cache cannot be replaced under the same key.
      #
      # The --lru lines drop what this run did not use (binaries first, then recipes
      # left without a use), so that packages of old versions and old package IDs are
      # not carried from one cache to the next for ever. Restoring a cache does not
      # count as a use. The limit only has to be longer than the job, or packages used
      # at its start would go too.
      - name: Collect the Conan packages to cache
        id: conan-save
        if: ${{ !cancelled() && steps.conan-cache.outputs.cache-hit != 'true' }}
        run: |
          conan remove "coro/*" --confirm
          conan remove "*/*#*:*#*" --lru=6h --confirm
          conan remove "*/*#*" --lru=6h --confirm
          conan cache clean "*" --source --build --download
          conan cache save "*/*:*" --file "$RUNNER_TEMP/conan-packages.tgz"

      - name: Cache the Conan packages
        if: ${{ !cancelled() && steps.conan-save.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/conan-packages.tgz
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
